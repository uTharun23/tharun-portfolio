<div class="modal-backdrop" [class.open]="isOpen" (click)="closeModal()">
  <div class="modal-content glass-card" [class.open]="isOpen" (click)="$event.stopPropagation()" appSpotlightGlow>
    <button class="modal-close" (click)="closeModal()" aria-label="Close modal">
      <i class="fa-solid fa-xmark"></i>
    </button>
    
    <div class="modal-body" *ngIf="project">
      <h2 class="modal-project-title">{{ project.title }}</h2>
      <span class="modal-project-cat">{{ project.category }}</span>
      
      <div class="modal-project-grid">
        <div class="modal-project-desc">
          <h4>Project Overview</h4>
          <p>{{ project.description }}</p>
          
          <div class="modal-project-features">
            <h4>Key Features</h4>
            <ul class="feature-list">
              <li *ngFor="let feat of project.features">
                <i class="fa-solid fa-circle-check"></i>
                <span>{{ feat }}</span>
              </li>
            </ul>
          </div>
        </div>
        
        <div class="modal-project-details-right">
          <div class="modal-project-architecture">
            <h4>System Architecture</h4>
            <div [innerHTML]="project.architecture"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
