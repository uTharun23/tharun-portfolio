<div class="project-card glass-card tilt-card" appTiltCard appSpotlightGlow>
  <!-- Large Card Thumbnail -->
  <div class="project-thumbnail">
    <img [src]="project.imgUrl" [alt]="project.title" class="thumbnail-img" />
    <div class="project-icon-badge">
      <i [class]="project.iconClass"></i>
    </div>
  </div>

  <!-- Content Details -->
  <div class="project-content">
    <h3>{{ project.title }}</h3>
    <p>{{ project.description }}</p>
    <div class="tag-row">
      <span *ngFor="let tag of project.tags">{{ tag }}</span>
    </div>
  </div>

  <!-- Actions Row -->
  <div class="project-actions">
    <a [href]="project.demoUrl" target="_blank" rel="noopener noreferrer" class="btn-project btn-project-demo" title="Live Demo">
      <i class="fa-solid fa-play"></i> Demo
    </a>
    <a [href]="project.githubUrl" target="_blank" rel="noopener noreferrer" class="btn-project btn-project-github" title="GitHub Code">
      <i class="fa-brands fa-github"></i> Code
    </a>
    <button class="btn-project btn-project-details" (click)="onOpenDetails()" title="Case Study Details">
      <i class="fa-solid fa-file-lines"></i> Details
    </button>
  </div>
</div>
